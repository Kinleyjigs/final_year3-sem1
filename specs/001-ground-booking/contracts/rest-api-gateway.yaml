openapi: 3.0.3
info:
  title: One Stop Book - API Gateway
  description: |
    REST API for the One Stop Book campus ground booking platform.
    This API Gateway aggregates microservices and exposes REST endpoints for external clients (React SPA, mobile apps).
    
    **Authentication**: All authenticated endpoints require a Bearer JWT token in the Authorization header.
    
    **Rate Limiting**:
    - Public endpoints: 100 requests/minute per IP
    - Authenticated endpoints: 20 requests/minute per user
    - Admin endpoints: 50 requests/minute per user
    
    **Error Responses**: All errors follow the format:
    ```json
    {
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable error message",
        "details": { ... }
      }
    }
    ```
  version: 1.0.0
  contact:
    name: One Stop Book Team
    email: [email protected]

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://api.onestopbook.campus/api
    description: Production

tags:
  - name: Auth
    description: User authentication and registration
  - name: Grounds
    description: Ground discovery and details
  - name: Bookings
    description: Booking creation and management
  - name: Admin - Grounds
    description: Admin ground management (requires ADMIN role)
  - name: Admin - Bookings
    description: Admin booking oversight (requires ADMIN role)
  - name: Admin - Maintenance
    description: Admin maintenance scheduling (requires ADMIN role)

paths:
  # ============================================================
  # AUTH ENDPOINTS
  # ============================================================
  
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, college]
              properties:
                email:
                  type: string
                  format: email
                  example: [email protected]
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123
                fullName:
                  type: string
                  example: Tenzin Kinley
                college:
                  type: string
                  example: Royal University of Bhutan
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: JWT authentication token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_EXISTS
                  message: An account with this email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Auth]
      summary: Update current user profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                college:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # GROUNDS ENDPOINTS (Public + Authenticated)
  # ============================================================

  /grounds:
    get:
      tags: [Grounds]
      summary: Search and filter grounds
      operationId: searchGrounds
      parameters:
        - name: college
          in: query
          description: Filter by college name
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter by availability start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter by availability end date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Grounds list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroundSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /grounds/{groundId}:
    get:
      tags: [Grounds]
      summary: Get ground details
      operationId: getGroundDetails
      parameters:
        - $ref: '#/components/parameters/groundId'
      responses:
        '200':
          description: Ground details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /grounds/{groundId}/availability:
    get:
      tags: [Grounds]
      summary: Get ground availability calendar
      operationId: getGroundAvailability
      parameters:
        - $ref: '#/components/parameters/groundId'
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability calendar retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  groundId:
                    type: string
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        slots:
                          type: array
                          items:
                            type: object
                            properties:
                              startTime:
                                type: string
                                format: time
                                example: "09:00"
                              endTime:
                                type: string
                                format: time
                                example: "10:00"
                              status:
                                type: string
                                enum: [available, booked, maintenance]
                              bookingId:
                                type: string
                                nullable: true
                                description: Present if status is 'booked'

  # ============================================================
  # BOOKINGS ENDPOINTS (Authenticated Users)
  # ============================================================

  /bookings:
    post:
      tags: [Bookings]
      summary: Create a new booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groundId, bookingDate, startTime, endTime]
              properties:
                groundId:
                  type: string
                  format: uuid
                bookingDate:
                  type: string
                  format: date
                  example: "2025-11-30"
                startTime:
                  type: string
                  format: time
                  example: "14:00"
                endTime:
                  type: string
                  format: time
                  example: "16:00"
                  description: Must be 1 or 2 hours after startTime
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid booking request (invalid time range, past date, etc.)
        '409':
          description: Booking conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: TIME_SLOT_UNAVAILABLE
                  message: This time slot is no longer available. Please select another.
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Bookings]
      summary: Get current user's bookings
      operationId: getUserBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Bookings list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Get booking details
      operationId: getBookingDetails
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      responses:
        '200':
          description: Booking details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Bookings]
      summary: Cancel a booking
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      responses:
        '200':
          description: Booking canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Cannot cancel (booking is in the past or already canceled)
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # ADMIN - GROUNDS MANAGEMENT
  # ============================================================

  /admin/grounds:
    post:
      tags: [Admin - Grounds]
      summary: Create a new ground
      operationId: createGround
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, college, location, capacity]
              properties:
                name:
                  type: string
                college:
                  type: string
                location:
                  type: string
                description:
                  type: string
                capacity:
                  type: integer
                  minimum: 1
                amenities:
                  type: array
                  items:
                    type: string
                peakHours:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    monday: ["18:00-20:00"]
                    saturday: ["09:00-12:00"]
      responses:
        '201':
          description: Ground created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundDetails'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [Admin - Grounds]
      summary: Get grounds for admin's college
      operationId: getAdminGrounds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grounds list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroundDetails'

  /admin/grounds/{groundId}:
    patch:
      tags: [Admin - Grounds]
      summary: Update ground details
      operationId: updateGround
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/groundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                description:
                  type: string
                capacity:
                  type: integer
                amenities:
                  type: array
                  items:
                    type: string
                peakHours:
                  type: object
                isActive:
                  type: boolean
      responses:
        '200':
          description: Ground updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundDetails'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # ADMIN - BOOKING OVERSIGHT
  # ============================================================

  /admin/bookings:
    get:
      tags: [Admin - Bookings]
      summary: Get all bookings for admin's college grounds
      operationId: getAdminBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELED]
        - name: groundId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Bookings list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingWithUser'

  /admin/bookings/{bookingId}/approve:
    post:
      tags: [Admin - Bookings]
      summary: Approve a pending booking
      operationId: approveBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      responses:
        '200':
          description: Booking approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/bookings/{bookingId}/reject:
    post:
      tags: [Admin - Bookings]
      summary: Reject a pending booking
      operationId: rejectBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Ground is reserved for college event
      responses:
        '200':
          description: Booking rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /admin/bookings/{bookingId}/cancel:
    post:
      tags: [Admin - Bookings]
      summary: Cancel an approved booking
      operationId: adminCancelBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/bookingId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Booking canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  # ============================================================
  # ADMIN - MAINTENANCE SCHEDULING
  # ============================================================

  /admin/maintenance:
    post:
      tags: [Admin - Maintenance]
      summary: Schedule a maintenance window
      operationId: createMaintenance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groundId, startDateTime, endDateTime, description]
              properties:
                groundId:
                  type: string
                  format: uuid
                startDateTime:
                  type: string
                  format: date-time
                  example: "2025-12-01T08:00:00Z"
                endDateTime:
                  type: string
                  format: date-time
                  example: "2025-12-01T18:00:00Z"
                description:
                  type: string
                  example: Grass resurfacing and drainage work
      responses:
        '201':
          description: Maintenance scheduled (conflicting bookings canceled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance:
                    $ref: '#/components/schemas/Maintenance'
                  canceledBookings:
                    type: array
                    items:
                      type: string
                    description: IDs of bookings that were canceled

    get:
      tags: [Admin - Maintenance]
      summary: Get maintenance windows for admin's grounds
      operationId: getAdminMaintenance
      security:
        - bearerAuth: []
      parameters:
        - name: groundId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Maintenance windows retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Maintenance'

  /admin/maintenance/{maintenanceId}:
    delete:
      tags: [Admin - Maintenance]
      summary: Cancel a maintenance window
      operationId: cancelMaintenance
      security:
        - bearerAuth: []
      parameters:
        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Maintenance canceled
        '403':
          $ref: '#/components/responses/Forbidden'

# ============================================================
# COMPONENTS
# ============================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    groundId:
      name: groundId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        college:
          type: string
        role:
          type: string
          enum: [VISITOR, USER, ADMIN]
        createdAt:
          type: string
          format: date-time

    GroundSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        college:
          type: string
        location:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    GroundDetails:
      allOf:
        - $ref: '#/components/schemas/GroundSummary'
        - type: object
          properties:
            description:
              type: string
            amenities:
              type: array
              items:
                type: string
            peakHours:
              type: object
            photos:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        groundId:
          type: string
          format: uuid
        groundName:
          type: string
        bookingDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELED]
        confirmationCode:
          type: string
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingWithUser:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                fullName:
                  type: string
                email:
                  type: string
                college:
                  type: string

    Maintenance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groundId:
          type: string
          format: uuid
        groundName:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

  responses:
    BadRequest:
      description: Bad request (validation error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              details:
                field: email
                issue: Invalid email format

    Unauthorized:
      description: Unauthorized (missing or invalid token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required

    Forbidden:
      description: Forbidden (insufficient permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
